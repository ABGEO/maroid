{{ template "header.html" . }}

<div class="card panel mt-2">
  <div class="card-body gap-6">
    <h1 class="page-title">Grant Access</h1>

    {{ if .Scopes }}
    <div>
      <p class="section-title">{{ .Client }} would like to:</p>
      <ul class="list panel">
        {{ range $scope := .Scopes }}
        <li class="list-row">{{ $scope }}</li>
        {{ end }}
      </ul>
    </div>
    {{ else }}
    <p class="page-lead">{{ .Client }} has not requested any personal information</p>
    {{ end }}

    <div class="flex flex-col gap-3">
      <form method="post">
        <input type="hidden" name="req" value="{{ .AuthReqID }}" />
        <input type="hidden" name="approval" value="approve">
        <button type="submit" class="btn btn-primary w-full">Grant Access</button>
      </form>
      <form method="post">
        <input type="hidden" name="req" value="{{ .AuthReqID }}" />
        <input type="hidden" name="approval" value="rejected">
        <button type="submit" class="btn btn-ghost w-full">Cancel</button>
      </form>
    </div>
  </div>
</div>

{{ template "footer.html" . }}
