{{ template "header.html" . }}

<div class="card panel mt-2">
  <div class="card-body gap-6">
    <h1 class="page-title">Log in to {{ issuer }}</h1>
    <div class="flex flex-col gap-3">
      {{ range $c := .Connectors }}
        <a href="{{ $c.URL }}" class="btn dex-btn-provider w-full justify-start gap-3">
          <span class="dex-btn-icon dex-btn-icon--{{ $c.Type }}"></span>
          <span class="dex-btn-text font-medium">Log in with {{ $c.Name }}</span>
        </a>
      {{ end }}
    </div>
  </div>
</div>

{{ template "footer.html" . }}
