{{ template "header.html" . }}

<div class="card gate-card mt-2 shadow-md">
  <div class="card-body gap-6">
    <h2 class="font-display text-xl font-semibold">Log in to {{ issuer }}</h2>
    <div class="flex flex-col gap-3">
      {{ range $c := .Connectors }}
        <a href="{{ $c.URL }}" class="btn dex-btn-provider w-full justify-start gap-3">
          <span class="dex-btn-icon dex-btn-icon--{{ $c.Type }}"></span>
          <span class="dex-btn-text font-semibold">Log in with {{ $c.Name }}</span>
        </a>
      {{ end }}
    </div>
  </div>
</div>

{{ template "footer.html" . }}
