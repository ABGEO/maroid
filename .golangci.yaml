version: "2"

run:
  concurrency: 4
  modules-download-mode: readonly
  issues-exit-code: 2
  allow-parallel-runners: true

output:
  formats:
    tab:
      path: stdout

linters:
  default: all
  disable:
    - exhaustruct
    - exhaustruct_v5
    - gomodguard
    - wsl
    - noinlineerr

  settings:
    depguard:
      rules:
        main:
          list-mode: lax
          allow:
            - $gostd
          deny:
            - pkg: math/rand$
              desc: use math/rand/v2
            - pkg: github.com/pkg/errors
              desc: Should be replaced by standard lib errors package

    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - generic
        - pluginapi.Plugin
        - notifierapi.Transport
        - notifierapi.Dispatcher
        - pluginapi.TelegramBot
        - paho.mqtt.golang.Client
        - repository.UserRepository
        - repository.IdentityRepository
        - repository.InvitationRepository
        - repository.AuthFlowRepository
        - auth.IdentityResolver
        - auth.TokenVerifier
        - secret.Cipher
        - settings.Service
        - pluginapi.SettingsProvider

    tagliatelle:
      case:
        rules:
          # A settings field keys its stored entry and its schema property, and both
          # follow the snake case that every configuration key in Maroid uses.
          json: snake

    varnamelen:
      min-name-length: 2
      ignore-names:
        - i
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
      ignore-decls:
        - w http.ResponseWriter
        - r *http.Request
        - r chi.Router

  exclusions:
    rules:
      - path: apps/hub/internal/config/
        text: "G117:"
        linters:
          - gosec

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines

  settings:
    gci:
      custom-order: true
      sections:
        - standard
        - default
        - prefix(github.com/abgeo/maroid)

    golines:
      reformat-tags: false

    gofmt:
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'
        - pattern: 'a[b:len(a)]'
          replacement: 'a[b:]'
