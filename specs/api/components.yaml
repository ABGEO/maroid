# Shared components. `SPC-002` requires a component that more than one fragment
# needs to live here, and a fragment to reference it rather than redefine it.
openapi: 3.1.0

info:
  title: The shared components of Maroid
  version: 1.0.0

paths: {}

components:
  schemas:
    Problem:
      type: object
      description: A problem detail document. See `ERR-001` and RFC 9457.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: >
            The problem type, as a relative reference. `ERR-002` gives the
            grammar and `ERR-003` the registry.
          examples: ["/problems/http/not-found"]
        title:
          type: string
          description: A short sentence in English. It is constant for the type.
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
        detail:
          type: string
          description: One sentence about this occurrence. `ERR-005` bounds it.
        instance:
          type: string
          format: uri-reference
          description: The flow identifier of the request. `ERR-006` gives the form.
          examples: ["/flows/0199c5e2-8f3a-7c21-9b4e-2f6a1d0c5e77"]

    ValidationProblem:
      description: A problem that names each failed field. See `ERR-004`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              description: One item for each field that caused the rejection. See `ERR-004`.
              items:
                type: object
                required: [detail, pointer]
                properties:
                  detail:
                    type: string
                  pointer:
                    type: string
                    description: A JSON Pointer in the fragment form of RFC 6901.

    FlowId:
      type: string
      maxLength: 128
      pattern: "^[a-zA-Z0-9/+_=-]+$"
      description: >
        The restriction that `ERR-006` applies. `Z-233` asks a specification to
        declare it.

    Role:
      type: string
      enum: [manager, editor, viewer]
      description: The workspace role, from the most access to the least. `OWN-011`.

    Member:
      type: object
      description: >
        One membership of a workspace. `WSPACE` and `PERMS` both answer it.
      required: [user_id, role, created_at, updated_at]
      properties:
        user_id:
          type: string
          format: uuid
        first_name:
          type: string
          description: Absent when the user record holds none. `APIFMT-FR-009`.
        last_name:
          type: string
          description: Absent when the user record holds none. `APIFMT-FR-009`.
        role:
          $ref: "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Page:
      type: object
      description: >
        One page of a collection. `RES-005` gives the members, and a document
        narrows `items` to the schema that the route answers.
      required: [items, self, first]
      properties:
        items:
          type: array
          items: {}
        self:
          type: string
          format: uri
        first:
          type: string
          format: uri
        next:
          type: string
          format: uri
        prev:
          type: string
          format: uri

    User:
      type: object
      required: [id, status, is_administrator, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
          description: Absent when the record holds none. `APIFMT-FR-009`.
        last_name:
          type: string
          description: Absent when the record holds none. `APIFMT-FR-009`.
        status:
          type: string
          enum: [active, blocked]
        is_administrator:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Password:
      type: string
      writeOnly: true
      minLength: 12
      description: >
        At most 72 bytes in UTF-8. A longer one answers 422 at the pointer of the field.
        `IDPROV-FR-023`.

  responses:
    PreconditionFailed:
      description: >
        The record changed after the client read it. The type is
        `/problems/http/precondition-failed`, and the client reads the record
        again before it writes what it still means to write. `APIFMT-FR-019`.
      headers:
        X-Flow-ID:
          $ref: "#/components/headers/FlowId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: >
        The request carries no valid credential, or the identity behind it holds
        no active user record. The type is `/problems/http/access-denied`.
      headers:
        X-Flow-ID:
          $ref: "#/components/headers/FlowId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RequestInvalid:
      description: >
        A query parameter or a header holds a value that the route does not take.
        The type is `/problems/http/request-invalid`, and `detail` names the
        parameter.
      headers:
        X-Flow-ID:
          $ref: "#/components/headers/FlowId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: >
        The workspace role of the acting user does not hold the permission that
        the operation declares. The type is `/problems/http/permission-denied`.
        `SEC-013`.
      headers:
        X-Flow-ID:
          $ref: "#/components/headers/FlowId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist.
      headers:
        X-Flow-ID:
          $ref: "#/components/headers/FlowId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Invalid:
      description: The body failed validation.
      headers:
        X-Flow-ID:
          $ref: "#/components/headers/FlowId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblem"
    Default:
      description: A failure. `ERR-001` gives the body.
      headers:
        X-Flow-ID:
          $ref: "#/components/headers/FlowId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    IdPUnavailable:
      headers:
        X-Flow-ID:
          $ref: "#/components/headers/FlowId"
      description: >
        Dex refused the connection or passed `dex.timeout`. The type is
        `/problems/hub/not-ready` with the dependency `dex`, and the hub changed
        nothing. `IDPROV-NFR-002`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  headers:
    ETag:
      description: >
        The validator of the record, strong, built from the moment of its last
        write. A client sends it back in `If-Match`. `APIFMT-DD-014`.
      schema:
        type: string
        examples: ['"1790332200123456789"']
    FlowId:
      description: The flow identifier of the request. `ERR-006`.
      schema:
        $ref: "#/components/schemas/FlowId"

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: >
        The UUID of the acting workspace. `OWN-003`. A workspace that the acting
        user is not a member of answers `not-found`.
      schema:
        type: string
        format: uuid
        examples: [01927f4e-3c2a-7b1d-9e8f-0a1b2c3d4e5f]

    FlowId:
      name: X-Flow-ID
      in: header
      required: false
      description: >
        The flow identifier. A client supplies one, and the hub generates one
        when the request carries none. `Z-233`, `ERR-006`.
      schema:
        $ref: "#/components/schemas/FlowId"

    Limit:
      name: limit
      in: query
      required: false
      description: The count of items. `RES-005` gives the default and the cap.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: An opaque cursor. `RES-006` gives it. A client constructs none.
      schema:
        type: string
        maxLength: 4096
    Sort:
      name: sort
      in: query
      required: false
      style: form
      explode: false
      description: >
        The fields that order the collection, each one optionally prefixed with
        `+` or `-`. A field with no prefix ascends. The operation declares the
        set that it takes. `RES-005`, `Z-154`.
      schema:
        type: array
        maxItems: 8
        items:
          type: string
          maxLength: 64
          pattern: "^[+-]?[a-z_][a-z_0-9]*$"
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >
        The validator that the client read. The write lands only while the
        record still holds it, and a record that moved answers 412. A write
        that names none lands, because `Z-182` does not make the header
        mandatory. `APIFMT-FR-019`.
      schema:
        type: string
        examples: ['"1790332200123456789"']
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        A key that the client picks for one write, so that repeating that write
        is safe. A repeat under one key answers the status, the body, and the
        `Content-Type`, `Location`, and `ETag` of the first write, and creates no
        second record. A repeat under one key with another method, path, query,
        or body answers `/problems/http/request-invalid`. A repeat that arrives
        while the first write still runs answers 409,
        `/problems/http/request-in-progress`, and the client sends it again. A body under a key holds at most
        1 MiB, and a larger one answers 413, `/problems/http/content-too-large`.
        The cache holds an answer for 24 hours. `Z-230`, `APIFMT-FR-020`.
      schema:
        type: string
        maxLength: 255
        examples: ["01a0cae5-eb36-777a-824e-6e7e28d7a6b1"]
