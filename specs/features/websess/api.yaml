# The routes that WEBSESS adds or changes. See `SPC-002`.
openapi: 3.1.0

x-maroid-document: hub

info:
  title: The session of a person at the web shell
  version: 0.1.0

servers:
  - url: /
    description: The hub.

paths:
  /auth/logout:
    post:
      operationId: signOut
      summary: End the session of the acting person.
      description: >
        Realizes `WEBSESS-FR-006` and `WEBSESS-FR-007`.
        The route runs behind no access check, so a second call answers as the
        first one did. It clears the session cookie whether one arrived or not,
        and it names the target that the browser goes to. The session at the
        identity provider survives, so a sign in that follows needs no question
        from that service. See `WEBSESS-DD-005`.
      security: []
      parameters:
        - $ref: "../../api/components.yaml#/components/parameters/FlowId"
        - name: redirect
          in: query
          required: false
          description: >
            The target that the browser goes to. The hub matches its origin
            against `auth.allowed_redirects`. A request that names none takes
            `auth.deck_url`.
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: >
            The session ended. The body names the target. The header clears the
            session cookie with the attributes that `SEC-008` gives and a
            negative age, so the browser replaces the value it holds.
          headers:
            X-Flow-ID:
              $ref: "../../api/components.yaml#/components/headers/FlowId"
            Set-Cookie:
              description: >
                `__Host-maroid_session` with an empty value and a negative age.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignOut"
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  schemas:
    SignOut:
      type: object
      required: [redirect]
      properties:
        redirect:
          type: string
          format: uri
          description: The target that the browser goes to.
      examples:
        - redirect: "https://deck.example/signed-out"

    Problem:
      type: object
      description: A problem detail document. See `ERR-001` and RFC 9457.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: The problem type. `ERR-002` gives the grammar, `ERR-003` the registry.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri

  responses:
    BadRequest:
      headers:
        X-Flow-ID:
          $ref: "../../api/components.yaml#/components/headers/FlowId"
      description: >
        The request names a target that `auth.allowed_redirects` does not hold.
        The hub clears no cookie.
        The type is `/problems/http/request-invalid`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalidRedirect:
              value:
                type: "/problems/http/request-invalid"
                title: "The request is not valid."
                status: 400
                detail: "The redirect parameter is absent or not allowed."
