# The routes that EXTID adds or changes. See `SPC-002`.
openapi: 3.1.0

info:
  title: External identities and the delegated sign in
  version: 0.1.0

servers:
  - url: /
    description: The hub.

paths:
  /auth:
    get:
      operationId: startSignIn
      summary: Start a sign in at the identity provider.
      description: >
        Realizes `EXTID-FR-001`.
        The hub writes a flow row with the intent `sign_in`, then redirects to Dex.
        The row holds the state, the nonce, the verifier, and the target.
        See `EXTID-DD-001`.
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/Redirect"
      responses:
        "302":
          $ref: "#/components/responses/ToProvider"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/link:
    get:
      operationId: startAttach
      summary: Start an attach of a further external account to the acting user.
      description: >
        Realizes `EXTID-FR-004` and `EXTID-FR-006`.
        The hub writes a flow row with the intent `attach` and the identifier of the
        acting user. The callback reads that identifier from the row, never from the
        request, so a rewritten cookie cannot move the attach.
      parameters:
        - name: provider
          in: query
          required: true
          description: >
            The identifier of the connector to attach. An attach names its provider,
            because the person chose it before the request.
          schema:
            type: string
        - $ref: "#/components/parameters/Redirect"
      responses:
        "302":
          $ref: "#/components/responses/ToProvider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/invite:
    get:
      operationId: redeemInvitation
      summary: Start the redemption of an invitation.
      description: >
        Realizes `EXTID-FR-012`, `EXTID-FR-013`, and `EXTID-FR-014`.
        The hub reads the invitation by the digest of the token. An invitation that is
        absent, consumed, or expired ends the request before Dex. Otherwise the hub
        writes a flow row with the intent `redeem` and redirects.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: >
            The token that the invite page of the deck read from its own address.
            `maroid user invite` printed that address. See `EXTID-DD-007`.
          schema:
            type: string
        - $ref: "#/components/parameters/Redirect"
      responses:
        "302":
          description: >
            The redirect to Dex when the invitation is valid. An invitation that is
            absent, consumed, or expired redirects to the target instead, with the
            query parameter `error=invitation_invalid`. The deck renders that.
            See `EXTID-DD-015`.
          headers:
            Location:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/NoTarget"

  /auth/callback:
    get:
      operationId: finishAuthFlow
      summary: Finish a sign in, an attach, or a redemption.
      description: >
        Realizes `EXTID-FR-001`, `EXTID-FR-002`, `EXTID-FR-003`, `EXTID-FR-004`,
        `EXTID-FR-005`, `EXTID-FR-012`, and `EXTID-FR-016`.
        The hub reads the flow row by the state and consumes it, then exchanges the
        code and verifies the token. The `intent` column of the row picks the branch.
        See `EXTID-DD-004`.
        A sign in that succeeds sets the session cookie and writes the profile
        of the provider onto the identity.
      security: []
      parameters:
        - name: state
          in: query
          required: true
          description: The state that names the flow row.
          schema:
            type: string
        - name: code
          in: query
          required: true
          description: The authorization code of Dex.
          schema:
            type: string
      responses:
        "302":
          description: >
            The target of the flow row. A failure carries the query parameter `error`
            with one of `no_identity`, `access_denied`, `identity_taken`, or
            `auth_failed`. `EXTID-DD-013` gives the reason that `no_identity` stands
            apart.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: >
                `__Host-maroid_session` with the access token of Dex, on a sign in and
                on a redemption that succeeds. `ADR-0004` decided the name and the
                token, and the specification of `WEBSESS` holds both.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Read the person of the current session.
      description: >
        The two names come from the record, and the picture from the token of the
        session. `provider` names the connector that authenticated this session, so a
        caller can tell which identity a detach would end.
      responses:
        "200":
          description: The name of the record, the picture of the session, and its provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/identities:
    get:
      operationId: listIdentities
      summary: Read every provider that Maroid offers, attached or not.
      description: >
        Realizes `EXTID-FR-009`.
        The list holds one member for each provider in `auth.providers`, whether an
        external account of that provider holds an identity of the acting user or
        not. `EXTID-DD-009` gives the reason that the list lives in the
        configuration, and `EXTID-DD-016` the reason that it lives apart from
        `/auth/me`.
      responses:
        "200":
          description: Every provider, in the order that the configuration holds.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderState"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/identities/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        description: The identifier of the connector in Dex.
        schema:
          type: string
    delete:
      operationId: detachIdentity
      summary: Detach an external account from the acting user.
      description: >
        Realizes `EXTID-FR-007` and `EXTID-FR-008`.
        The hub refuses to detach the last identity of a record, because nobody
        reaches a record that holds none. See `EXTID-DD-003`.
      responses:
        "204":
          description: The identity is gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NoIdentity"
        "409":
          $ref: "#/components/responses/LastIdentity"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-maroid_session
      description: >
        The access token that Dex issued. `SEC-005` gives this cookie as the one
        path of a web request, and the hub reads no `Authorization` header on it.

  parameters:
    Provider:
      name: provider
      in: query
      required: false
      description: >
        The identifier of the connector in Dex. The hub sends it as `connector_id`,
        and `auth.providers` holds the list that it accepts. A request that names none
        reaches the connector list of Dex, which is the page that a person picks from.
      schema:
        type: string
    Redirect:
      name: redirect
      in: query
      required: true
      description: >
        The address that the flow returns to. The hub refuses one that
        `auth.allowed_redirects` does not hold.
      schema:
        type: string
        format: uri

  schemas:
    CurrentUser:
      type: object
      required: [firstName, lastName, picture, provider]
      description: >
        The person of the current session. The two names come from the record that
        the owner set, and the picture from the token of the session.
      properties:
        firstName:
          type: string
          nullable: true
          description: The first name that the owner set on the record.
        lastName:
          type: string
          nullable: true
          description: The last name that the owner set on the record.
        picture:
          type: string
          description: >
            The `picture` claim of the token. It is empty when the provider gave
            none, and the shell then draws the initials of the person.
        provider:
          type: string
          description: The connector that authenticated this session.
      examples:
        - firstName: Temuri
          lastName: Takalandze
          picture: https://example.com/a.jpg
          provider: telegram

    ProviderState:
      type: object
      required: [provider, name, attached]
      description: >
        One provider that Maroid offers. The four members below `attached` are present
        only when `attached` is true.
      properties:
        provider:
          type: string
        name:
          type: string
          description: The text that the deck shows.
        attached:
          type: boolean
        username:
          type: ["string", "null"]
        displayName:
          type: ["string", "null"]
        pictureUrl:
          type: ["string", "null"]
        attachedAt:
          type: string
          format: date-time
      examples:
        - provider: telegram
          name: Telegram
          attached: true
          username: ABGEO07
          displayName: Temuri
          pictureUrl: https://example.com/a.jpg
          attachedAt: 2026-09-15T10:00:00Z
        - provider: cloud
          name: ABGEO.cloud
          attached: false

    Problem:
      type: object
      description: A problem detail document. See `ERR-001` and RFC 9457.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: The problem type. `ERR-002` gives the grammar, `ERR-003` the registry.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri

  responses:
    ToProvider:
      description: The redirect to Dex, with `connector_id` and the state.
      headers:
        Location:
          schema:
            type: string

    BadRequest:
      description: >
        A parameter is absent, the target is not in `auth.allowed_redirects`, or the
        state names no flow row.
        The type is `urn:maroid:problem:http:request-invalid`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    Unauthorized:
      description: >
        The request carries no token, or no identity names an active record.
        The type is `urn:maroid:problem:http:access-denied`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    NoTarget:
      description: >
        The target of the redemption is absent, or `auth.allowed_redirects` does not
        hold it. No target exists to report the failure at, so this answers in the
        body. Every other failure of this route redirects. See `EXTID-DD-015`.
        The type is `urn:maroid:problem:http:request-invalid`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    NoIdentity:
      description: >
        No identity of the acting user names that provider.
        The type is `urn:maroid:problem:http:not-found`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    LastIdentity:
      description: >
        The identity is the last one of the record. `EXTID-INV-002` keeps it.
        The type is `urn:maroid:problem:hub:identity-last`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

security:
  - sessionCookie: []
