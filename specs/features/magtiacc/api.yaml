# The routes that MAGTIACC adds. See `SPC-002`.
openapi: 3.1.0

x-maroid-document: hub

info:
  title: The telecom account of a workspace
  version: 0.1.0

servers:
  - url: /
    description: The hub.

security:
  - sessionCookie: [uid]

paths:
  /workspaces/{workspaceId}/plugins/dev.maroid.magti/api/connections/self:
    parameters:
      - $ref: "../../api/components.yaml#/components/parameters/WorkspaceId"
      - $ref: "../../api/components.yaml#/components/parameters/FlowId"
    get:
      operationId: getTelecomConnection
      summary: Read the connection of the acting workspace.
      description: >
        Realizes `MAGTIACC-FR-003` to `MAGTIACC-FR-007`, `MAGTIACC-FR-014`, `MAGTIACC-FR-015`,
        and `MAGTIACC-DD-004`. A connected workspace reads the subscribers and their kinds from
        the portal on each call. A rejected session signs in again once. A rejection of the
        sign in removes the session, and the answer is `not_connected`. The permission is
        `account.read`.
      responses:
        "200":
          description: The connection.
          headers:
            X-Flow-ID:
              $ref: "../../api/components.yaml#/components/headers/FlowId"
            ETag:
              $ref: "#/components/headers/AssignmentETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "401":
          $ref: "../../api/components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../../api/components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../../api/components.yaml#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: connectTelecomAccount
      summary: Sign in with the workspace settings, and store the connection.
      description: >
        Realizes `MAGTIACC-FR-008` to `MAGTIACC-FR-011`, `MAGTIACC-DD-001`, and
        `MAGTIACC-DD-002`. A repeat replaces the session and keeps the assigned subscriber.
        The permission is `account.connect`.
      responses:
        "200":
          description: The connection.
          headers:
            X-Flow-ID:
              $ref: "../../api/components.yaml#/components/headers/FlowId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "401":
          $ref: "../../api/components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../../api/components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../../api/components.yaml#/components/responses/NotFound"
        "422":
          description: >
            The type is `/problems/dev.maroid.magti/credentials-absent`,
            `/problems/dev.maroid.magti/credentials-rejected`,
            `/problems/dev.maroid.magti/code-required`, or
            `/problems/dev.maroid.magti/account-locked`.
          headers:
            X-Flow-ID:
              $ref: "../../api/components.yaml#/components/headers/FlowId"
          content:
            application/problem+json:
              schema:
                $ref: "../../api/components.yaml#/components/schemas/Problem"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteTelecomConnection
      summary: End the connection of the acting workspace.
      description: >
        Realizes `MAGTIACC-FR-012` and `MAGTIACC-FR-013`. The assigned subscriber goes. The
        settings, the traffic, and the money entries stay. A workspace with no connection
        gets 204 too. The permission is `account.connect`.
      responses:
        "204":
          description: No connection exists.
          headers:
            X-Flow-ID:
              $ref: "../../api/components.yaml#/components/headers/FlowId"
        "401":
          $ref: "../../api/components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../../api/components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../../api/components.yaml#/components/responses/NotFound"

  /workspaces/{workspaceId}/plugins/dev.maroid.magti/api/subscriber-assignments/self:
    parameters:
      - $ref: "../../api/components.yaml#/components/parameters/WorkspaceId"
      - $ref: "../../api/components.yaml#/components/parameters/FlowId"
    put:
      operationId: assignTelecomSubscriber
      summary: Assign a subscriber of the account to the acting workspace.
      description: >
        Realizes `MAGTIACC-FR-016` to `MAGTIACC-FR-019`, `MAGTIACC-DD-004`, and
        `MAGTIACC-DD-008`. The assignment replaces the one that exists, stores the kind of the
        subscriber, and collects nothing. The collection answers no `GET`, as `ADR-0015`
        permits. A client sends the `ETag` of `GET /connections/self` in `If-Match`. The
        permission is `account.connect`.
      parameters:
        - $ref: "../../api/components.yaml#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Assignment"
      responses:
        "200":
          description: The connection, with the new assigned subscriber.
          headers:
            X-Flow-ID:
              $ref: "../../api/components.yaml#/components/headers/FlowId"
            ETag:
              $ref: "#/components/headers/AssignmentETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/MalformedBody"
        "401":
          $ref: "../../api/components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../../api/components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../../api/components.yaml#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotConnected"
        "412":
          $ref: "../../api/components.yaml#/components/responses/PreconditionFailed"
        "413":
          description: >
            The body passes 4 KiB. The type is `/problems/http/content-too-large`.
          headers:
            X-Flow-ID:
              $ref: "../../api/components.yaml#/components/headers/FlowId"
          content:
            application/problem+json:
              schema:
                $ref: "../../api/components.yaml#/components/schemas/Problem"
        "422":
          description: >
            The body failed validation, with the type `/problems/http/validation-failed`, or
            the type is `/problems/dev.maroid.magti/subscriber-unknown` or
            `/problems/dev.maroid.magti/subscriber-unsupported`.
          headers:
            X-Flow-ID:
              $ref: "../../api/components.yaml#/components/headers/FlowId"
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: "../../api/components.yaml#/components/schemas/ValidationProblem"
                  - $ref: "../../api/components.yaml#/components/schemas/Problem"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"

  /workspaces/{workspaceId}/plugins/dev.maroid.magti/api/subscriber-states/self:
    parameters:
      - $ref: "../../api/components.yaml#/components/parameters/WorkspaceId"
      - $ref: "../../api/components.yaml#/components/parameters/FlowId"
    get:
      operationId: getTelecomSubscriberState
      summary: Read the state of the assigned subscriber from the portal.
      description: >
        Realizes `MAGTIACC-FR-032` to `MAGTIACC-FR-036`, `MAGTIACC-NFR-001`,
        `MAGTIACC-DD-005`, `MAGTIACC-DD-006`, and `MAGTIACC-DD-013`. Each call reads the
        portal, and Maroid keeps no copy. The permission is `account.read`.
      responses:
        "200":
          description: The state.
          headers:
            X-Flow-ID:
              $ref: "../../api/components.yaml#/components/headers/FlowId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriberState"
        "401":
          $ref: "../../api/components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../../api/components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../../api/components.yaml#/components/responses/NotFound"
        "409":
          description: >
            The type is `/problems/dev.maroid.magti/not-connected` or
            `/problems/dev.maroid.magti/not-assigned`.
          headers:
            X-Flow-ID:
              $ref: "../../api/components.yaml#/components/headers/FlowId"
          content:
            application/problem+json:
              schema:
                $ref: "../../api/components.yaml#/components/schemas/Problem"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"

  /workspaces/{workspaceId}/plugins/dev.maroid.magti/api/traffic-days:
    parameters:
      - $ref: "../../api/components.yaml#/components/parameters/WorkspaceId"
      - $ref: "../../api/components.yaml#/components/parameters/FlowId"
    get:
      operationId: listTelecomTrafficDays
      summary: List the traffic of the assigned mobile subscriber in a period.
      description: >
        Realizes `MAGTIACC-FR-040` to `MAGTIACC-FR-044`, `MAGTIACC-FR-048` to
        `MAGTIACC-FR-051`, and `MAGTIACC-DD-015`. The page holds the rows of the acting
        workspace alone, of its assigned subscriber. `sort` takes `day`, and the default is
        `day`. One subscriber holds one row of a day, so no tie occurs. The route reads no
        portal. The permission is `account.read`.
      parameters:
        - $ref: "../../api/components.yaml#/components/parameters/Limit"
        - $ref: "../../api/components.yaml#/components/parameters/Cursor"
        - $ref: "../../api/components.yaml#/components/parameters/Sort"
        - name: from
          in: query
          required: true
          description: The first day of the period, at most 366 days before `to`.
          schema:
            type: string
            format: date
            examples: ["2026-10-26"]
        - name: to
          in: query
          required: true
          description: The last day of the period.
          schema:
            type: string
            format: date
            examples: ["2026-11-24"]
      responses:
        "200":
          description: One page of days. A subscriber with no traffic answers an empty page.
          headers:
            X-Flow-ID:
              $ref: "../../api/components.yaml#/components/headers/FlowId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrafficDayPage"
        "400":
          $ref: "../../api/components.yaml#/components/responses/RequestInvalid"
        "401":
          $ref: "../../api/components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../../api/components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../../api/components.yaml#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NoMobileSubscriber"

  /workspaces/{workspaceId}/plugins/dev.maroid.magti/api/money-entries:
    parameters:
      - $ref: "../../api/components.yaml#/components/parameters/WorkspaceId"
      - $ref: "../../api/components.yaml#/components/parameters/FlowId"
    get:
      operationId: listTelecomMoneyEntries
      summary: List the money entries of the assigned mobile subscriber.
      description: >
        Realizes `MAGTIACC-FR-045`, `MAGTIACC-FR-046`, `MAGTIACC-FR-048` to
        `MAGTIACC-FR-051`, and `MAGTIACC-DD-016`. The page holds the rows of the acting
        workspace alone, of its assigned subscriber. `sort` takes `occurred_at`, and the
        default is `-occurred_at`. A tie on `occurred_at` sorts by `id` in the same direction.
        The route reads no portal. The permission is `account.read`.
      parameters:
        - $ref: "../../api/components.yaml#/components/parameters/Limit"
        - $ref: "../../api/components.yaml#/components/parameters/Cursor"
        - $ref: "../../api/components.yaml#/components/parameters/Sort"
      responses:
        "200":
          description: One page of money entries. A subscriber with none answers an empty page.
          headers:
            X-Flow-ID:
              $ref: "../../api/components.yaml#/components/headers/FlowId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoneyEntryPage"
        "400":
          $ref: "../../api/components.yaml#/components/responses/RequestInvalid"
        "401":
          $ref: "../../api/components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../../api/components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../../api/components.yaml#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NoMobileSubscriber"

  /workspaces/{workspaceId}/plugins/dev.maroid.magti/api/monthly-money-totals:
    parameters:
      - $ref: "../../api/components.yaml#/components/parameters/WorkspaceId"
      - $ref: "../../api/components.yaml#/components/parameters/FlowId"
    get:
      operationId: listTelecomMonthlyMoneyTotals
      summary: List the totals of the top ups and the charges of each month.
      description: >
        Realizes `MAGTIACC-FR-047` to `MAGTIACC-FR-051` and `MAGTIACC-DD-017`. The page sums
        the rows of the acting workspace alone, of its assigned subscriber, and holds each
        month from `from` to the current month of Tbilisi. A month with no money entry
        answers zero. The collection holds at most 12 items, so it answers one page, and
        `limit` and `cursor` do not apply (`RES-005`). `sort` takes `month`, and the default
        is `-month`. The route reads no portal. The permission is `account.read`.
      parameters:
        - $ref: "../../api/components.yaml#/components/parameters/Sort"
        - name: from
          in: query
          required: true
          description: The first month, at most 11 months before the current month of Tbilisi.
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
            examples: ["2025-12"]
      responses:
        "200":
          description: The months.
          headers:
            X-Flow-ID:
              $ref: "../../api/components.yaml#/components/headers/FlowId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyMoneyTotalPage"
        "400":
          $ref: "../../api/components.yaml#/components/responses/RequestInvalid"
        "401":
          $ref: "../../api/components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../../api/components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../../api/components.yaml#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NoMobileSubscriber"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-maroid_session
      description: >
        The session cookie. `SEC-005`. Every operation declares the pseudo permission
        `uid`, because its caller is the acting user. `RES-009`.

  schemas:
    Connection:
      type: object
      required: [state, credentials_stored]
      properties:
        state:
          type: string
          enum: [not_connected, connected]
        credentials_stored:
          type: boolean
          description: Whether the workspace settings hold a username and a password.
        subscribers:
          type: array
          description: Present when `state` is `connected`. Every subscriber of the account.
          items:
            $ref: "#/components/schemas/Subscriber"
    Subscriber:
      type: object
      description: >
        No name, personal number, or contact of the account holder appears. `MAGTIACC-INV-004`.
      required: [subscriber_number, label, kind, assigned]
      properties:
        subscriber_number:
          type: string
          description: The number of the subscriber at the portal.
          examples: ["599000001", "d_example.ge"]
        label:
          type: string
          description: The label that the holder gave the subscriber at the portal. It may be empty.
          examples: ["House"]
        kind:
          type: string
          enum: [mobile, home_line, other]
        assigned:
          type: boolean
          description: Whether the subscriber is assigned to the acting workspace.
    Assignment:
      type: object
      additionalProperties: false
      required: [subscriber_number]
      properties:
        subscriber_number:
          type: string
          minLength: 1
          maxLength: 64
    SubscriberState:
      type: object
      description: >
        A member that the kind of the subscriber does not hold is absent. `MAGTIACC-DD-013`.
      required: [subscriber_number, kind, status, balance]
      properties:
        subscriber_number:
          type: string
        kind:
          type: string
          enum: [mobile, home_line]
        status:
          type: string
          description: The status, as the portal gives it.
        balance:
          $ref: "#/components/schemas/Money"
        plan:
          $ref: "#/components/schemas/Plan"
        allowances:
          $ref: "#/components/schemas/Allowances"
        speed:
          type: string
          description: The speed of the internet of a home line, as the portal gives it.
          examples: ["70 Mbps"]
    Plan:
      type: object
      required: [price, days_left]
      properties:
        name:
          type: string
          description: The name of the plan of a mobile subscriber.
        price:
          $ref: "#/components/schemas/Money"
        renews_on:
          type: string
          format: date
          description: The day of the next renewal of a mobile plan, in Tbilisi.
        days_left:
          type: integer
          format: int32
          minimum: 0
          description: The days from today to the next renewal.
    Allowances:
      type: object
      required: [data_mb, call_seconds, sms]
      properties:
        data_mb:
          type: number
          format: decimal
          examples: [2589.29]
        call_seconds:
          type: integer
          format: int32
          examples: [3376]
        sms:
          type: integer
          format: int32
          examples: [100]
    TrafficDay:
      type: object
      description: A series that the portal answered no value for is absent.
      required: [day]
      properties:
        day:
          type: string
          format: date
          description: A day of Tbilisi.
        data_mb:
          type: number
          format: decimal
        call_in_seconds:
          type: integer
          format: int32
        call_out_seconds:
          type: integer
          format: int32
        sms_sent:
          type: integer
          format: int32
        sms_received:
          type: integer
          format: int32
    MoneyEntry:
      type: object
      required: [id, occurred_at, direction, kind, amount]
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
          description: The moment, in UTC.
        direction:
          type: string
          enum: [in, out]
          description: "`in` is a top up. `out` is a charge."
        kind:
          type: string
          description: The kind, as the portal gives it.
        amount:
          $ref: "#/components/schemas/Money"
    MonthlyMoneyTotal:
      type: object
      required: [month, top_ups, charges]
      properties:
        month:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
          examples: ["2026-11"]
        top_ups:
          $ref: "#/components/schemas/Money"
        charges:
          $ref: "#/components/schemas/Money"
    Money:
      type: object
      description: An amount of money, the money object of `Z-173`.
      required: [amount, currency]
      properties:
        amount:
          type: number
          format: decimal
          examples: [17.3]
        currency:
          type: string
          format: iso-4217
          description: The currency. The portal bills in lari alone.
          examples: [GEL]
    TrafficDayPage:
      allOf:
        - $ref: "../../api/components.yaml#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/TrafficDay"
    MoneyEntryPage:
      allOf:
        - $ref: "../../api/components.yaml#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/MoneyEntry"
    MonthlyMoneyTotalPage:
      allOf:
        - $ref: "../../api/components.yaml#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              maxItems: 12
              items:
                $ref: "#/components/schemas/MonthlyMoneyTotal"

  headers:
    AssignmentETag:
      description: >
        The validator of the assigned subscriber, built from the moment of its last write,
        as the `ETag` of `specs/api/components.yaml` is. Absent when the workspace holds no
        assigned subscriber.
      schema:
        type: string
        examples: ['"1795464000123456789"']

  responses:
    NotConnected:
      description: >
        The workspace holds no connection. The type is
        `/problems/dev.maroid.magti/not-connected`.
      headers:
        X-Flow-ID:
          $ref: "../../api/components.yaml#/components/headers/FlowId"
      content:
        application/problem+json:
          schema:
            $ref: "../../api/components.yaml#/components/schemas/Problem"
    NoMobileSubscriber:
      description: >
        The workspace holds no assigned subscriber, with the type
        `/problems/dev.maroid.magti/not-assigned`, or the assigned subscriber is a home line,
        with the type `/problems/dev.maroid.magti/home-line`.
      headers:
        X-Flow-ID:
          $ref: "../../api/components.yaml#/components/headers/FlowId"
      content:
        application/problem+json:
          schema:
            $ref: "../../api/components.yaml#/components/schemas/Problem"
    MalformedBody:
      description: >
        The body is not a JSON object, with the type `/problems/http/body-invalid`,
        or it names a member that the schema does not declare, with the type
        `/problems/http/member-unknown`.
      headers:
        X-Flow-ID:
          $ref: "../../api/components.yaml#/components/headers/FlowId"
      content:
        application/problem+json:
          schema:
            $ref: "../../api/components.yaml#/components/schemas/Problem"
    ServiceUnavailable:
      description: >
        The portal failed, answered nothing, or answered no state within `state_timeout`.
        The type is `/problems/dev.maroid.magti/service-unavailable`. A stored connection stays.
      headers:
        X-Flow-ID:
          $ref: "../../api/components.yaml#/components/headers/FlowId"
      content:
        application/problem+json:
          schema:
            $ref: "../../api/components.yaml#/components/schemas/Problem"
