openapi: 3.1.0

x-maroid-document: mcp

info:
  title: The hub as a Model Context Protocol server
  version: 0.1.0

servers:
  - url: /
    description: The hub.

security:
  - mcpBearerAuth: []

paths:
  /.well-known/oauth-protected-resource:
    get:
      operationId: getProtectedResourceMetadata
      summary: Report the authorization server of the hub.
      description: >
        Realizes `MCPHUB-FR-001`. RFC 9728. Public: an MCP client reads this
        before it holds a token.
      security: []
      responses:
        "200":
          description: The metadata of the protected resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedResourceMetadata"

  /.well-known/oauth-protected-resource/mcp:
    get:
      operationId: getProtectedResourceMetadataForMcp
      summary: Report the authorization server of the hub, for the /mcp resource.
      description: >
        Realizes `MCPHUB-FR-001`. RFC 9728 section 3.1, the well-known path of
        a resource that is not the root. The same body as the bare path.
      security: []
      responses:
        "200":
          description: The metadata of the protected resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedResourceMetadata"

  /mcp:
    post:
      operationId: callMcp
      summary: Exchange one Model Context Protocol message.
      description: >
        Realizes `MCPHUB-FR-002` through `MCPHUB-FR-006`. The body and the
        response follow the JSON-RPC 2.0 shape that the Model Context
        Protocol specification gives, not an OpenAPI schema of its own. This
        declaration names the transport, the authentication, and the error
        shape, not each JSON-RPC method.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A JSON-RPC 2.0 request or notification.
      responses:
        "200":
          description: >
            One JSON-RPC 2.0 response. `MCPHUB-DD-003` answers every call
            with one response, never a stream.
          content:
            application/json:
              schema:
                type: object
                description: A JSON-RPC 2.0 response.
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      operationId: getMcp
      summary: Rejected. See `MCPHUB-DD-003`.
      responses:
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    delete:
      operationId: deleteMcp
      summary: Rejected. See `MCPHUB-DD-003`.
      responses:
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

components:
  securitySchemes:
    mcpBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        The token that the IdP mints for its "mcp" client. `SEC-002`,
        `MCPHUB-DD-001`.

  schemas:
    ProtectedResourceMetadata:
      type: object
      required: [resource, authorization_servers]
      properties:
        resource:
          type: string
          format: uri
          description: The canonical identifier of `/mcp`.
        authorization_servers:
          type: array
          items:
            type: string
            format: uri
          description: The IdP.
        scopes_supported:
          type: array
          items:
            type: string
        resource_name:
          type: string

    Problem:
      type: object
      description: A problem detail document. See `ERR-001` and RFC 9457.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: The problem type. `ERR-002` gives the grammar, `ERR-003` the registry.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri

  responses:
    Unauthorized:
      description: >
        The request carries no valid token, or the identity behind it holds
        no active user record. `MCPHUB-FR-002`, `MCPHUB-FR-003`.
        The type is `urn:maroid:problem:http:access-denied`.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Names the discovery route of the failed request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    MethodNotAllowed:
      description: >
        The stateless transport of `MCPHUB-DD-003` answers no `GET` and no `DELETE`.
        The type is `urn:maroid:problem:http:method-not-allowed`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
