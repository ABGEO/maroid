# The routes that GWPACC adds. See `SPC-002`.
openapi: 3.1.0

x-maroid-document: hub

info:
  title: The water account of a workspace
  version: 0.1.0

servers:
  - url: /
    description: The hub.

security:
  - sessionCookie: []

paths:
  /workspaces/{workspaceId}/plugins/dev.maroid.gwp/api/connections/self:
    parameters:
      - $ref: "../../api/components.yaml#/components/parameters/WorkspaceId"
      - $ref: "../../api/components.yaml#/components/parameters/FlowId"
    get:
      operationId: getWaterConnection
      summary: Read the connection of the acting workspace.
      description: >
        Realizes `GWPACC-FR-003` to `GWPACC-FR-007`, `GWPACC-FR-012`, and `GWPACC-FR-018`. A connected
        workspace reads the customers from the water service on each call. A rejection of
        the token signs in again once. A rejection of the credentials removes the token, and
        the answer is `not_connected`. The permission is `account.read`.
      responses:
        "200":
          description: The connection.
          headers:
            X-Flow-ID:
              $ref: "../../api/components.yaml#/components/headers/FlowId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "401":
          $ref: "../../api/components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../../api/components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../../api/components.yaml#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: connectWaterAccount
      summary: Sign in with the workspace settings, and store the connection.
      description: >
        Realizes `GWPACC-FR-008`, `GWPACC-FR-009`, and `GWPACC-DD-003`. A repeat replaces
        the token and keeps the assigned customer. The permission is `account.connect`.
      responses:
        "200":
          description: The connection.
          headers:
            X-Flow-ID:
              $ref: "../../api/components.yaml#/components/headers/FlowId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "401":
          $ref: "../../api/components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../../api/components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../../api/components.yaml#/components/responses/NotFound"
        "422":
          description: >
            The type is `/problems/dev.maroid.gwp/credentials-absent` or
            `/problems/dev.maroid.gwp/credentials-rejected`.
          headers:
            X-Flow-ID:
              $ref: "../../api/components.yaml#/components/headers/FlowId"
          content:
            application/problem+json:
              schema:
                $ref: "../../api/components.yaml#/components/schemas/Problem"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteWaterConnection
      summary: End the connection of the acting workspace.
      description: >
        Realizes `GWPACC-FR-010` and `GWPACC-FR-011`. The assigned customer goes. The
        settings and the readings stay. A workspace with no connection gets 204 too. The
        permission is `account.connect`.
      responses:
        "204":
          description: No connection exists.
          headers:
            X-Flow-ID:
              $ref: "../../api/components.yaml#/components/headers/FlowId"
        "401":
          $ref: "../../api/components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../../api/components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../../api/components.yaml#/components/responses/NotFound"

  /workspaces/{workspaceId}/plugins/dev.maroid.gwp/api/customer-assignments/self:
    parameters:
      - $ref: "../../api/components.yaml#/components/parameters/WorkspaceId"
      - $ref: "../../api/components.yaml#/components/parameters/FlowId"
    put:
      operationId: assignWaterCustomer
      summary: Assign a customer of the account to the acting workspace.
      description: >
        Realizes `GWPACC-FR-013` to `GWPACC-FR-015` and `GWPACC-DD-006`. The assignment
        replaces the one that exists, then collects the readings of the customer. A failed
        collection keeps the assignment and answers 200. The collection answers no `GET`,
        as `ADR-0015` permits. The permission is `account.connect`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Assignment"
      responses:
        "200":
          description: The connection, with the new assigned customer.
          headers:
            X-Flow-ID:
              $ref: "../../api/components.yaml#/components/headers/FlowId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/MalformedBody"
        "401":
          $ref: "../../api/components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../../api/components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../../api/components.yaml#/components/responses/NotFound"
        "413":
          description: >
            The body passes 4 KiB. The type is `/problems/http/content-too-large`.
          headers:
            X-Flow-ID:
              $ref: "../../api/components.yaml#/components/headers/FlowId"
          content:
            application/problem+json:
              schema:
                $ref: "../../api/components.yaml#/components/schemas/Problem"
        "409":
          description: >
            The workspace holds no connection. The type is
            `/problems/dev.maroid.gwp/not-connected`.
          headers:
            X-Flow-ID:
              $ref: "../../api/components.yaml#/components/headers/FlowId"
          content:
            application/problem+json:
              schema:
                $ref: "../../api/components.yaml#/components/schemas/Problem"
        "422":
          description: >
            The body failed validation, with the type `/problems/http/validation-failed`,
            or the type is `/problems/dev.maroid.gwp/customer-unknown`.
          headers:
            X-Flow-ID:
              $ref: "../../api/components.yaml#/components/headers/FlowId"
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: "../../api/components.yaml#/components/schemas/ValidationProblem"
                  - $ref: "../../api/components.yaml#/components/schemas/Problem"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"

  /workspaces/{workspaceId}/plugins/dev.maroid.gwp/api/readings:
    parameters:
      - $ref: "../../api/components.yaml#/components/parameters/WorkspaceId"
      - $ref: "../../api/components.yaml#/components/parameters/FlowId"
    get:
      operationId: listWaterReadings
      summary: List the readings of the assigned customer.
      description: >
        Realizes `GWPACC-FR-028` to `GWPACC-FR-033`, `GWPACC-DD-011`, and
        `GWPACC-DD-012`. The page holds the readings of the customer assigned to the
        acting workspace, the latest date first, and the identifier breaks a tie. The
        route reads no water service. The permission is `account.read`.
      parameters:
        - $ref: "../../api/components.yaml#/components/parameters/Limit"
        - $ref: "../../api/components.yaml#/components/parameters/Cursor"
        - name: from
          in: query
          required: false
          description: The earliest reading date that the page holds.
          schema:
            type: string
            format: date
            examples: ["2025-10-12"]
      responses:
        "200":
          description: One page of readings. A customer with no reading answers an empty page.
          headers:
            X-Flow-ID:
              $ref: "../../api/components.yaml#/components/headers/FlowId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingPage"
        "400":
          $ref: "../../api/components.yaml#/components/responses/RequestInvalid"
        "401":
          $ref: "../../api/components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../../api/components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../../api/components.yaml#/components/responses/NotFound"
        "409":
          description: >
            The workspace holds no assigned customer. The type is
            `/problems/dev.maroid.gwp/not-assigned`.
          headers:
            X-Flow-ID:
              $ref: "../../api/components.yaml#/components/headers/FlowId"
          content:
            application/problem+json:
              schema:
                $ref: "../../api/components.yaml#/components/schemas/Problem"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-maroid_session
      description: The session cookie. `SEC-005`.

  schemas:
    Connection:
      type: object
      required: [state, credentials_stored]
      properties:
        state:
          type: string
          enum: [not_connected, connected]
        credentials_stored:
          type: boolean
          description: Whether the workspace settings hold a username and a password.
        customers:
          type: array
          description: Present when `state` is `connected`. Every customer of the account.
          items:
            $ref: "#/components/schemas/Customer"
    Customer:
      type: object
      required: [customer_number, address, assigned]
      properties:
        customer_number:
          type: string
          examples: ["764795058"]
        communal_number:
          type: string
          description: >
            The number of the customer on the communal bill. Absent when the water
            service gives none.
        address:
          type: string
          description: The city, the street, and the building, as the water service gives them.
        assigned:
          type: boolean
          description: Whether the customer is assigned to the acting workspace.
    Assignment:
      type: object
      additionalProperties: false
      required: [customer_number]
      properties:
        customer_number:
          type: string
          minLength: 1
          maxLength: 64

    Reading:
      type: object
      required: [id, serial_number, reading_date, value]
      properties:
        id:
          type: string
          format: uuid
        serial_number:
          type: string
          description: The serial number of the meter.
          examples: ["H24MA082393"]
        reading_date:
          type: string
          format: date
        value:
          type: number
          format: decimal
          description: The value of the meter on the date, in cubic metres.
        usage:
          type: number
          format: decimal
          description: >
            The value minus the value of the reading before it, of the same meter, in
            cubic metres. Absent for the earliest reading of a meter. A replaced meter
            can give a negative usage.
    ReadingPage:
      allOf:
        - $ref: "../../api/components.yaml#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Reading"

  responses:
    MalformedBody:
      description: >
        The body is not a JSON object, with the type `/problems/http/body-invalid`,
        or it names a member that the schema does not declare, with the type
        `/problems/http/member-unknown`.
      headers:
        X-Flow-ID:
          $ref: "../../api/components.yaml#/components/headers/FlowId"
      content:
        application/problem+json:
          schema:
            $ref: "../../api/components.yaml#/components/schemas/Problem"
    ServiceUnavailable:
      description: >
        The water service failed or answered nothing. The type is
        `/problems/dev.maroid.gwp/service-unavailable`. A stored connection stays.
      headers:
        X-Flow-ID:
          $ref: "../../api/components.yaml#/components/headers/FlowId"
      content:
        application/problem+json:
          schema:
            $ref: "../../api/components.yaml#/components/schemas/Problem"
